language: java
dist: focal
cache:
  directories:
    - ~/.cache
    - ~/.embedmongo
    - ~/.engine
    - ~/.m2
  timeout: 900
#jdk:
#  - openjdk14
addons:
  apt:
    packages:
      - xvfb
      - psmisc
before_install:
  - curl -s "https://get.sdkman.io" | bash
  - source "$HOME/.sdkman/bin/sdkman-init.sh"
  - sdk install java 25.0.5.1+2-tem
  - sdk use java 25.0.5.1+2-tem
  - 'sudo apt-get install -y libgconf-2-4'
  - 'nvm install v22.14.0'
  - 'nvm use v22.14.0'
  - 'npm i -g npm@10'
install:
  - './travis-build.sh'
script:
  - './travis.sh'
before_cache:
  - rm -rf ./dist/ ./target/
  - rm -rf ~/.engine/*/target/ ~/.engine/*/*/target
  - rm -rf ~/.m2/repository/io/lumeer/
